name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml and installs the pinned toolchain
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path examples/esp32/Cargo.toml --all --check
      - run: python3 -m unittest discover -s bench/vm-execution -v
      - run: python3 -m unittest discover -s bench/instructions -v
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --release --workspace
      # Small builds: shard documentation prose compiled out, contract kept.
      - run: cargo test -p otter-core -p otter-io --no-default-features --test metadata --test catalog
      - run: cargo test -p otter-lang --no-default-features
      # Release builds must run flows nested to the compose limit (compose still recurses).
      - run: cargo test --release -p otter-lang --test lang nesting_up_to_the_limit
      # As in 1.x, TLS is an explicit feature; make sure the rustls-ring build works.
      - run: cargo clippy -p otter-io --all-targets --features rustls-ring -- -D warnings

  wasm:
    # The engine runs on wasm without Asyncify; this runs the acceptance
    # tests as a wasm32-wasip1 binary under Node's WASI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show && rustup target add wasm32-wasip1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p otter-core -p otter-lang --target wasm32-wasip1 --lib --tests -- -D warnings
      - name: Run acceptance, metadata and frontend tests on wasm
        run: |
          cargo test -p otter-core --test prototype --test metadata --test trampoline --test host_contract --test registry --test functions --test values --target wasm32-wasip1 --no-run
          cargo test -p otter-lang --test lang --target wasm32-wasip1 --no-run
          node scripts/run-wasi.mjs "$(ls -t target/wasm32-wasip1/debug/deps/prototype-*.wasm | head -1)"
          node scripts/run-wasi.mjs "$(ls -t target/wasm32-wasip1/debug/deps/metadata-*.wasm | head -1)"
          node scripts/run-wasi.mjs "$(ls -t target/wasm32-wasip1/debug/deps/trampoline-*.wasm | head -1)"
          node scripts/run-wasi.mjs "$(ls -t target/wasm32-wasip1/debug/deps/host_contract-*.wasm | head -1)"
          node scripts/run-wasi.mjs "$(ls -t target/wasm32-wasip1/debug/deps/registry-*.wasm | head -1)"
          node scripts/run-wasi.mjs "$(ls -t target/wasm32-wasip1/debug/deps/functions-*.wasm | head -1)"
          node scripts/run-wasi.mjs "$(ls -t target/wasm32-wasip1/debug/deps/values-*.wasm | head -1)"
          node scripts/run-wasi.mjs "$(ls -t target/wasm32-wasip1/debug/deps/lang-*.wasm | head -1)"

  hot-asm:
    # The interpreter loop and the engine step, summarized from the release
    # disassembly (instructions, spills, calls): any change to them fails
    # here until the baseline is refreshed with the reason in the commit
    # (docs/runtime-performance-overview.md, lessons 6 and 7). The summary
    # it measured is uploaded either way, to commit after an intended change.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/hot-asm.py --check bench/hot-asm/aarch64-apple-darwin.txt --fresh fresh/aarch64-apple-darwin.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hot-asm-aarch64-apple-darwin
          path: fresh/aarch64-apple-darwin.txt

  bench:
    # Compose costs gated against bench/compose/baseline.txt (allocations,
    # and time relative to flat twins); the runtime benchmarks are printed
    # for the log, not gated (bench/compose/README.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p otter-lang --example bench_compose -- --check bench/compose/baseline.txt
      - run: cargo run --release -p otter-core --example bench_tables -- 200000
      - run: cargo run --release -p otter-core --example bench_instances -- 1000
      - run: cargo run --release -p otter-core --example bench_depth -- --progress

  instructions:
    # Instructions, allocations and bytes per iteration under Cachegrind,
    # exact, against bench/instructions/TARGET.txt (docs/performance-gates.md),
    # on x86-64 and on aarch64, where the code differs (instruction
    # selection, registers, spills). The images are pinned: instruction counts
    # depend on their Valgrind and C library, which each baseline records. The
    # measured baseline is uploaded either way; after an intended change,
    # commit it with the reason (bench/instructions/README.md).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: python3 bench/instructions/run.py --check --fresh fresh/${{ matrix.target }}.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instructions-${{ matrix.target }}
          path: fresh/${{ matrix.target }}.txt
