[package]
name = "otter-io"
description = "Otter I/O shards (HTTP, filesystem), on a shared Tokio runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["docs"]
# Documentation prose in shard descriptions; off for small builds.
docs = ["otter-core/docs"]
# As in 1.x (shards/modules/http): no default TLS backend, choose one
# explicitly. Plain HTTP works without one.
native-tls = ["reqwest/native-tls"]
# rustls with the ring crypto provider (avoids the aws-lc-rs C build).
rustls-ring = ["reqwest/rustls-no-provider", "dep:rustls", "dep:ring"]

[dependencies]
otter-core = { path = "../otter-core", default-features = false }
reqwest = { version = "0.13", default-features = false }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"], optional = true }
ring = { version = "0.17", optional = true }

[dev-dependencies]
otter-lang = { path = "../otter-lang", default-features = false }
