[package]
name = "otter-core"
description = "Otter: the Shards 2.0 runtime core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["docs"]
# Documentation prose in shard descriptions (summaries and help). Turn off
# for small builds; the argument contract is kept either way.
docs = []
# Check every value a leaf or async shard produces against its compose
# output type in release builds too (always on in debug builds).
output-checks = []

