[package]
name = "otter-cli"
description = "The otter command: check, run and describe Shards programs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "otter"
path = "src/main.rs"

[dependencies]
otter-core = { path = "../otter-core" }
otter-io = { path = "../otter-io" }
otter-lang = { path = "../otter-lang" }
tokio = { version = "1", features = ["signal"] }
