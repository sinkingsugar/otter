[package]
name = "otter-cli"
description = "The otter command: check, run and describe Shards programs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "otter"
path = "src/main.rs"

[features]
# The command ships with TLS (rustls on ring): tools fetch https. A build
# without it: `--no-default-features --features docs`.
default = ["docs", "tls"]
docs = ["otter-io/docs", "otter-text/docs"]
tls = ["otter-io/rustls-ring"]

[dependencies]
otter-core = { path = "../otter-core" }
otter-io = { path = "../otter-io", default-features = false }
otter-lang = { path = "../otter-lang" }
otter-text = { path = "../otter-text", default-features = false }
tokio = { version = "1", features = ["signal"] }
