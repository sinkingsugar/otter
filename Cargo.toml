[workspace]
resolver = "3"
members = ["crates/*", "bench/authoring"]
exclude = ["examples/esp32"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sinkingsugar/otter"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
