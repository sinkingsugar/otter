[package]
name = "otter-esp32"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Separate workspace: ESP-IDF needs build-std and its own toolchain.
[workspace]
resolver = "3"

[[bin]]
name = "otter-esp32"
harness = false

[features]
acceptance = ["dep:syn", "dep:quote"]

[dependencies]
esp-idf-sys = { version = "=0.38.1", features = ["binstart"] }
otter-core = { path = "../../crates/otter-core", default-features = false }
otter-lang = { path = "../../crates/otter-lang", default-features = false }

[build-dependencies]
syn = { version = "2", features = ["full", "parsing"], optional = true }
quote = { version = "1", optional = true }
embuild = { version = "0.33.5", features = ["espidf"] }

[profile.release]
opt-level = "s"
debug = true
panic = "abort"

[profile.dev]
opt-level = "z"
panic = "abort"
